[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notebooklm"
version = "0.1.0"
description = "CLI for Google NotebookLM"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "keyring>=24",
    "rich>=13",
]

[project.scripts]
notebooklm = "notebooklm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["notebooklm*"]
